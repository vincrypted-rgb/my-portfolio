<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vincent — Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window">
    <!-- Top toolbar -->
    <div class="toolbar">
      <div class="nav-buttons">
        <button class="nav-btn" id="back" title="Back">←</button>
        <button class="nav-btn" id="forward" title="Forward">→</button>
        <button class="nav-btn" id="up" title="Up">↑</button>
      </div>
      <div class="breadcrumb" id="breadcrumb"></div>
    </div>

    <!-- Main area -->
    <div class="main">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-item">🏠 Home</div>
        <div class="sidebar-item">🖼️ Gallery</div>
        <div class="sidebar-item">🖥️ Desktop</div>
        <div class="sidebar-item">⬇️ Downloads</div>
        <div class="sidebar-item">📄 Documents</div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-item">💻 This PC</div>
      </aside>

      <!-- File list -->
      <section class="files" id="files"></section>
    </div>

    <!-- Status bar -->
    <div class="statusbar">
      <span id="status">3 items</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
