<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio — File Explorer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="desktop" id="desktop">

    <!-- Desktop icons -->
    <div class="desktop-icons">
      <button class="desktop-icon" id="iconThisPC" title="This PC">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <rect x="6" y="8" width="36" height="24" rx="2" fill="#5B9BD5"/>
          <rect x="9" y="11" width="30" height="16" fill="#EAF3FC"/>
          <rect x="18" y="34" width="12" height="4" fill="#8B8B8B"/>
          <rect x="14" y="38" width="20" height="2.5" rx="1.2" fill="#6E6E6E"/>
        </svg>
        <span>This PC</span>
      </button>
      <button class="desktop-icon" id="iconRecycleBin" title="Recycle Bin">
        <svg viewBox="0 0 48 48" width="40" height="40">
          <path d="M14 16h20l-2 24a3 3 0 0 1-3 2.7H19a3 3 0 0 1-3-2.7L14 16z" fill="#B7D6EA" stroke="#5B7B94" stroke-width="1.5"/>
          <rect x="12" y="12" width="24" height="3.5" rx="1" fill="#7C97A8"/>
          <rect x="20" y="7" width="8" height="3.5" rx="1" fill="#7C97A8"/>
          <line x1="19" y1="20" x2="20" y2="38" stroke="#5B7B94" stroke-width="1.4"/>
          <line x1="24" y1="20" x2="24" y2="38" stroke="#5B7B94" stroke-width="1.4"/>
          <line x1="29" y1="20" x2="28" y2="38" stroke="#5B7B94" stroke-width="1.4"/>
        </svg>
        <span>Recycle Bin</span>
      </button>
    </div>

    <!-- Explorer window -->
    <div class="window" id="explorerWindow">

      <div class="titlebar" id="titlebar">
        <div class="titlebar-left">
          <svg viewBox="0 0 48 48" width="16" height="16" class="titlebar-icon">
            <path d="M6 12a2 2 0 0 1 2-2h10l3 4h19a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V12z" fill="#FFC83D"/>
            <path d="M6 18h36v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V18z" fill="#FFA000"/>
          </svg>
          <span class="titlebar-title" id="windowTitle">Home</span>
        </div>
        <div class="window-controls">
          <button class="win-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" width="15" height="15"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" id="btnMinimize" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 12 12" width="12" height="12"><rect x="1" y="6" width="10" height="1.2" fill="currentColor"/></svg>
          </button>
          <button class="win-btn" id="btnMaximize" title="Maximize" aria-label="Maximize">
            <svg viewBox="0 0 12 12" width="11" height="11"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button class="win-btn win-btn-close" id="btnClose" title="Close" aria-label="Close">
            <svg viewBox="0 0 12 12" width="12" height="12"><line x1="1" y1="1" x2="11" y2="11" stroke="currentColor" stroke-width="1.2"/><line x1="11" y1="1" x2="1" y2="11" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
      </div>

      <div class="commandbar">
        <button class="cmd-btn" id="cmdNew">
          <span class="cmd-icon">+</span> New folder
        </button>
        <div class="cmd-divider"></div>
        <div class="cmd-dropdown-wrap">
          <button class="cmd-btn dropdown" id="cmdSort">Sort <span class="chev">⌄</span></button>
          <div class="dropdown-panel" id="sortPanel" hidden>
            <button data-sort="name">Name</button>
            <button data-sort="date">Date modified</button>
            <button data-sort="type">Type</button>
            <button data-sort="size">Size</button>
          </div>
        </div>
        <div class="cmd-dropdown-wrap">
          <button class="cmd-btn dropdown" id="cmdView">View <span class="chev">⌄</span></button>
          <div class="dropdown-panel" id="viewPanel" hidden>
            <button data-view="large">Large icons</button>
            <button data-view="medium">Medium icons</button>
            <button data-view="list">List</button>
            <button data-view="details">Details</button>
          </div>
        </div>
        <button class="cmd-btn icon-only" id="cmdRefresh" title="Refresh">⟳</button>
      </div>

      <div class="navbar">
        <button class="nav-btn" id="btnBack" title="Back" disabled>‹</button>
        <button class="nav-btn" id="btnForward" title="Forward" disabled>›</button>
        <button class="nav-btn" id="btnUp" title="Up" disabled>↑</button>
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search this folder" />
        </div>
      </div>

      <div class="explorer-body">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="content" tabindex="0"></main>
      </div>

      <div class="statusbar">
        <span id="statusLeft">0 items</span>
        <div class="status-right">
          <button class="status-icon-btn" data-quickview="details" title="Details view">☰</button>
          <button class="status-icon-btn" data-quickview="large" title="Large icons">▦</button>
        </div>
      </div>
    </div>

    <!-- Taskbar chip shown while minimized/closed -->
    <button class="taskbar-chip" id="taskbarChip" hidden>📁 Portfolio — File Explorer</button>

    <!-- Start menu popover -->
    <div class="start-menu" id="startMenu" hidden>
      <div class="start-search"><span>🔍</span><span>Type here to search</span></div>
      <div class="start-label">Pinned</div>
      <div class="start-tiles">
        <button class="start-tile" data-action="explorer">
          <span class="tile-icon">📁</span><span>File Explorer</span>
        </button>
        <button class="start-tile" data-action="github">
          <span class="tile-icon">🐙</span><span>GitHub</span>
        </button>
        <button class="start-tile" data-action="linkedin">
          <span class="tile-icon">💼</span><span>LinkedIn</span>
        </button>
        <button class="start-tile" data-action="email">
          <span class="tile-icon">✉️</span><span>Email me</span>
        </button>
      </div>
      <div class="start-footer">
        <span id="startUserName">Welcome</span>
      </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
      <button class="start-btn" id="startBtn" title="Start">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <rect x="2" y="2" width="9" height="9" fill="#4CC2FF"/>
          <rect x="13" y="2" width="9" height="9" fill="#4CC2FF"/>
          <rect x="2" y="13" width="9" height="9" fill="#4CC2FF"/>
          <rect x="13" y="13" width="9" height="9" fill="#4CC2FF"/>
        </svg>
      </button>
      <div class="taskbar-search" id="taskbarSearch">
        <span>🔍</span>
        <input type="text" id="taskbarSearchInput" placeholder="Search the web" />
      </div>
      <div class="taskbar-icons">
        <button class="task-icon" id="taskExplorer" title="File Explorer">📁</button>
      </div>
      <div class="taskbar-tray">
        <span class="tray-icon">▲</span>
        <div class="taskbar-clock" id="clock"></div>
      </div>
    </div>
  </div>

  <!-- File preview / properties modal -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal-window" id="modalWindow">
      <div class="modal-titlebar">
        <span id="modalTitle">Notepad</span>
        <button id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Context menu -->
  <ul class="context-menu" id="contextMenu" hidden></ul>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
